name: Refresh lines

on:
  # Every hour, every day. The weather updates on every run (it's free). Lines only refresh at
  # 8am, noon and 5pm Central on weekdays and 9am, 1pm and 5pm on Saturday (scripts/refresh-odds.mjs),
  # each one also added to the line history (site/data/history.json), and final scores are checked
  # once each morning from 5am, Tuesday through Saturday (scripts/refresh-scores.mjs). After each
  # refresh, big line moves go to your phone through ntfy (scripts/line-alerts.mjs).
  schedule:
    - cron: "7 * * * *"
  # Started from outside: the site's Refresh button (force: true, lines now), the outside timer at
  # cron-job.org (force: false, same as a scheduled run), or "Run workflow" on the Actions tab.
  # GitHub skips many scheduled runs when it's busy, so the outside timer is what keeps the times.
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh the lines now, even outside the schedule (uses 3 credits)"
        type: boolean
        default: false
  # Changes to the page publish it (with fresh weather) without pulling new lines.
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-lines
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pull lines if it's time
        id: fetch
        if: github.event_name != 'push'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: node scripts/refresh-odds.mjs

      - name: Send alerts for big line moves
        id: alerts
        if: github.event_name != 'push'
        continue-on-error: true  # an alert problem never holds up the lines or weather
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node scripts/line-alerts.mjs

      - name: Check final scores if it's time
        id: scores
        if: github.event_name != 'push'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: node scripts/refresh-scores.mjs

      - name: Update the weather
        id: weather
        env:
          CHECK_STADIUMS: ${{ github.event_name == 'push' }}
        run: node scripts/refresh-weather.mjs

      - name: Save the new lines, scores and weather
        if: steps.fetch.outputs.changed == 'true' || steps.scores.outputs.changed == 'true' || steps.weather.outputs.changed == 'true' || steps.alerts.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/odds.json site/data/scores.json site/data/weather.json
          if [ -f site/data/history.json ]; then git add site/data/history.json; fi
          if [ -f state/line-alerts.json ]; then git add state/line-alerts.json; fi
          if [ "${{ steps.fetch.outputs.changed }}" = "true" ]; then msg="Refresh lines";
          elif [ "${{ steps.scores.outputs.changed }}" = "true" ]; then msg="Check final scores";
          elif [ "${{ steps.alerts.outputs.changed }}" = "true" ]; then msg="Line alerts";
          else msg="Refresh weather"; fi
          git commit -m "$msg" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push --quiet origin HEAD:main && exit 0
            sleep 5
          done
          echo "Couldn't save the new data to the repository." && exit 1

      - name: Decide whether to publish
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ steps.fetch.outputs.changed }}" = "true" ] || [ "${{ steps.scores.outputs.changed }}" = "true" ] || [ "${{ steps.weather.outputs.changed }}" = "true" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v6
        if: steps.decide.outputs.publish == 'true'

      - uses: actions/upload-pages-artifact@v5
        if: steps.decide.outputs.publish == 'true'
        with:
          path: site

  publish:
    needs: refresh
    if: needs.refresh.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
